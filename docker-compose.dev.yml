services:

  # --------------------------------------------------
  # Nuxt / Node.js (desenvolvimento manual)
  # --------------------------------------------------
  nuxt:
    build: .
    container_name: nuxt-dev

    working_dir: /app

    ports:
      - "3000:3000"

    volumes:
      # Código do projeto montado para desenvolvimento
      - .:/app

    env_file:
      - .env.dev

    environment:
      NODE_ENV: development
      APP_ENV: dev
      NUXT_PUBLIC_APP_ENV: dev
      HOST: 0.0.0.0
      PORT: 3000
      # Sobrescreve o DATABASE_URL do .env para apontar para o container postgres compartilhado
      DATABASE_URL: postgresql://nuxt_dev:nuxt_dev@postgres-shared:5432/nuxt_dev

    # Ambiente de desenvolvimento: não inicia a aplicação automaticamente.
    # Você entra no container e roda os comandos manualmente.
    command: tail -f /dev/null

    depends_on:
      postgres:
        condition: service_healthy

  # --------------------------------------------------
  # PostgreSQL (compartilhado entre local e dev)
  # --------------------------------------------------
  postgres:
    image: postgres:18.6
    container_name: postgres-shared
    restart: always

    environment:
      POSTGRES_USER: nuxt_dev
      POSTGRES_PASSWORD: nuxt_dev

    ports:
      - "5432:5432"

    volumes:
      # PostgreSQL 18+ espera o mount em /var/lib/postgresql (subdiretório versionado)
      - ./postgres_data:/var/lib/postgresql
      # Cria os bancos nuxt_local e nuxt_dev na primeira inicialização
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nuxt_dev -d nuxt_dev"]
      interval: 5s
      timeout: 5s
      retries: 5
