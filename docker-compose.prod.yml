services:

  # --------------------------------------------------
  # Nginx: reverse proxy, HTTPS e load balancer
  # --------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: nginx-prod
    restart: always

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro

    depends_on:
      nuxt:
        condition: service_healthy

  # --------------------------------------------------
  # Nuxt / Node.js (escalável via --scale nuxt=N)
  # --------------------------------------------------
  nuxt:
    build:
      context: .
      dockerfile: Dockerfile.prod
    restart: always

    env_file:
      - .env.prod

    environment:
      NODE_ENV: production
      APP_ENV: prod
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    # Não expõe portas no host — o Nginx acessa via rede interna
    # Para escalar: docker compose -f docker-compose.prod.yml up -d --scale nuxt=5

  # --------------------------------------------------
  # PostgreSQL
  # --------------------------------------------------
  postgres:
    image: postgres:18.6
    container_name: postgres-prod
    restart: always

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_prod_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --------------------------------------------------
  # Redis: cache e sessões
  # --------------------------------------------------
  redis:
    image: redis:7.4-alpine
    container_name: redis-prod
    restart: always

    volumes:
      - redis_prod_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_prod_data:
  redis_prod_data:
