services:

  # --------------------------------------------------
  # Nuxt / Node.js (uso pessoal local)
  # --------------------------------------------------
  nuxt:
    build:
      context: .
      dockerfile: Dockerfile.local
    container_name: nuxt-local
    restart: always

    ports:
      - "3000:3000"

    env_file:
      - .env

    volumes:
      # Código montado para refletir alterações sem rebuild
      - .:/app

    # Permite alternar entre dev (padrão) e preview de produção/PWA via variável.
    # Exemplo para testar PWA:
    #   NUXT_COMMAND="npm run preview:build" NODE_ENV=production docker compose up
    command: ${NUXT_COMMAND:-npm run dev -- --host 0.0.0.0}

    environment:
      # development por padrão; use NODE_ENV=production para preview de PWA
      NODE_ENV: ${NODE_ENV:-development}
      APP_ENV: local
      NUXT_PUBLIC_APP_ENV: local
      HOST: 0.0.0.0
      PORT: 3000
      # Usa o banco nuxt_local, separado do ambiente de desenvolvimento
      DATABASE_URL: postgresql://nuxt_dev:nuxt_dev@postgres-shared:5432/nuxt_local

    depends_on:
      postgres:
        condition: service_healthy

  # --------------------------------------------------
  # PostgreSQL (compartilhado entre local e dev)
  # --------------------------------------------------
  postgres:
    image: postgres:18.6
    container_name: postgres-shared
    restart: always

    environment:
      POSTGRES_USER: nuxt_dev
      POSTGRES_PASSWORD: nuxt_dev

    ports:
      - "5432:5432"

    volumes:
      # PostgreSQL 18+ espera o mount em /var/lib/postgresql (subdiretório versionado)
      - ./postgres_data:/var/lib/postgresql
      # Cria os bancos nuxt_local e nuxt_dev na primeira inicialização
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nuxt_dev -d nuxt_local"]
      interval: 5s
      timeout: 5s
      retries: 5
