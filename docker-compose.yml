services:

  # --------------------------------------------------
  # Nuxt / Node.js
  # --------------------------------------------------
  nuxt:
    build: .
    container_name: nuxt-dev

    working_dir: /app

    ports:
      - "3000:3000"

    volumes:
      # Código do projeto
      - .:/app

    env_file:
      - .env

    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 3000
      # Sobrescreve o DATABASE_URL do .env para apontar para o container postgres
      DATABASE_URL: postgresql://nuxt_dev:nuxt_dev@postgres:5432/nuxt_dev

    depends_on:
      postgres:
        condition: service_healthy

  # --------------------------------------------------
  # PostgreSQL
  # --------------------------------------------------
  postgres:
    image: postgres:18.6
    container_name: postgres-dev

    restart: unless-stopped

    environment:
      POSTGRES_DB: nuxt_dev
      POSTGRES_USER: nuxt_dev
      POSTGRES_PASSWORD: nuxt_dev

    ports:
      - "5432:5432"

    volumes:
      # PostgreSQL 18+ espera o mount em /var/lib/postgresql (subdiretório versionado)
      - ./postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nuxt_dev -d nuxt_dev"]
      interval: 5s
      timeout: 5s
      retries: 5


